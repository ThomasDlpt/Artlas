<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Artlas · Connexion administrateur</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/artlas/tokens.css">
<link rel="stylesheet" href="ds/artlas/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&amp;family=Source+Sans+3:ital,wght@0,400..700;1,400..700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#f7f3ea}
a{color:#a8401f}a:hover{color:#86321a}
</style>
</helmet>
<div class="atl" style="min-height: 900px; display: flex; flex-direction: column; background: var(--paper-100)">
  <header style="display: flex; align-items: center; gap: 12px; padding: 16px 24px">
    <a class="atl-logo" href="#" style="font-size: 20px">Art<i>las</i></a>
    <a href="#" class="atl-btn atl-btn--ghost atl-btn--sm" style="margin-left: auto; border-radius: 999px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>Retour à la carte</a>
  </header>
  <main style="flex: 1; display: grid; place-items: center; padding: 24px 16px 96px">
    <form aria-labelledby="titre" style="width: 100%; max-width: 400px; box-sizing: border-box; padding: 32px; background: var(--paper-50); border-radius: 20px; box-shadow: 0 1px 2px rgba(31,27,22,.06), 0 16px 40px rgba(31,27,22,.12); display: flex; flex-direction: column; gap: 18px">
      <div style="display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px">
        <span style="width: 52px; height: 52px; border-radius: 50%; background: var(--paper-100); display: grid; place-items: center; color: var(--ink-muted)"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="10.5" width="14" height="10" rx="1.5"></rect><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"></path></svg></span>
        <h1 id="titre" style="margin: 8px 0 0; font: 600 22px/28px var(--font-serif); font-variation-settings: 'opsz' 32; color: var(--ink)">Espace administrateur</h1>
        <p style="margin: 0; font: 400 14px/20px var(--font-sans); color: var(--ink-muted)">Synchroniser les sources et corriger les fiches.</p>
      </div>

      <div>
        <label for="mdp" style="display: block; font: 600 12px/16px var(--font-sans); color: var(--ink-muted); margin: 0 0 6px 4px">Mot de passe</label>
        <div style="{{fieldStyle}}">
          <input id="mdp" type="password" autocomplete="current-password" aria-invalid="{{invalid}}" aria-describedby="mdp-msg" defaultValue="artlas2026" style="flex: 1; min-width: 0; border: 0; background: none; outline-offset: 4px; font: 400 16px/22px var(--font-sans); color: var(--ink)">
          <button type="button" class="atl-btn atl-btn--ghost atl-btn--sm" style="color: var(--ink-muted); min-height: 36px; border-radius: 999px">Afficher</button>
        </div>
        <sc-if value="{{erreur}}" hint-placeholder-val="{{ true }}">
          <p id="mdp-msg" role="alert" style="margin: 8px 4px 0; display: flex; gap: 6px; align-items: flex-start; font: 400 13px/18px var(--font-sans); color: var(--error)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 1px"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 7.5v5.5"></path><circle cx="12" cy="16.3" r=".6"></circle></svg><span><b style="font-weight: 600">Mot de passe incorrect.</b> Vérifiez les majuscules et réessayez.</span></p>
        </sc-if>
      </div>

      <button type="button" class="atl-btn atl-btn--primary" onClick="{{toggle}}" style="width: 100%; border-radius: 999px">Se connecter</button>
      <p style="margin: 0; text-align: center; font: 400 12px/16px var(--font-sans); color: var(--ink-subtle)">Réservé à l’équipe Artlas · déconnexion après 30 min d’inactivité</p>
    </form>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"erreur":{"editor":"boolean","default":true},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const err = this.state && this.state.err != null ? this.state.err : (this.props.erreur ?? true);
    return {
      erreur: err,
      invalid: err ? 'true' : 'false',
      fieldStyle: 'display: flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 4px 0 16px; border-radius: 999px; background: var(--paper-100); ' + (err ? 'box-shadow: inset 0 0 0 1.5px var(--error)' : 'box-shadow: none'),
      toggle: () => this.setState({ err: !err })
    };
  }
}
</script>
</body>
</html>
