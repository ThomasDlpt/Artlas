<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Pictogramme de type</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/artlas/tokens.css">
<link rel="stylesheet" href="ds/artlas/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<style>body{margin:0}</style>
</helmet>
<span style="display: inline-flex; line-height: 0; color: inherit">
<sc-if value="{{isMusee}}" hint-placeholder-val="{{ true }}"><svg width="{{size}}" height="{{size}}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="{{stroke}}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9.5 12 4l9 5.5"></path><path d="M4 9.5h16"></path><path d="M6.5 12.5v5M10.2 12.5v5M13.8 12.5v5M17.5 12.5v5"></path><path d="M3.5 20.5h17"></path></svg></sc-if>
<sc-if value="{{isMonument}}" hint-placeholder-val="{{ false }}"><svg width="{{size}}" height="{{size}}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="{{stroke}}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 21V9h10v12"></path><path d="M6 9V4.5h2.5v2h2.3v-2h2.4v2h2.3v-2H18V9"></path><path d="M10.5 21v-3.5a1.5 1.5 0 0 1 3 0V21"></path><path d="M4.5 21h15"></path></svg></sc-if>
<sc-if value="{{isExposition}}" hint-placeholder-val="{{ false }}"><svg width="{{size}}" height="{{size}}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="{{stroke}}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4.5" width="16" height="12.5" rx="1"></rect><path d="m7 14 3.2-3.6 2.4 2.6 1.6-1.6L17 14"></path><circle cx="15" cy="8.3" r="1.2"></circle><path d="M12 17v3.5M8.5 20.5h7"></path></svg></sc-if>
<sc-if value="{{isTheatre}}" hint-placeholder-val="{{ false }}"><svg width="{{size}}" height="{{size}}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="{{stroke}}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h14v7a7 7 0 0 1-14 0z"></path><path d="M8.3 8.8h2.2M13.5 8.8h2.2"></path><path d="M9 13.8a4 4 0 0 0 6 0"></path></svg></sc-if>
<sc-if value="{{isCinema}}" hint-placeholder-val="{{ false }}"><svg width="{{size}}" height="{{size}}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="{{stroke}}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10h18v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"></path><path d="m3.2 10-.7-3 16.4-4 .8 3z"></path><path d="m7.6 5.9 2.2 3M12.6 4.7l2.2 3"></path></svg></sc-if>
<sc-if value="{{isBibliotheque}}" hint-placeholder-val="{{ false }}"><svg width="{{size}}" height="{{size}}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="{{stroke}}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 6.5C10 5 7 4.5 3.5 5v13c3.5-.5 6.5 0 8.5 1.5 2-1.5 5-2 8.5-1.5V5C17 4.5 14 5 12 6.5z"></path><path d="M12 6.5v13"></path></svg></sc-if>
<sc-if value="{{isAutre}}" hint-placeholder-val="{{ false }}"><svg width="{{size}}" height="{{size}}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="{{stroke}}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 21 12 12 21 3 12z"></path><circle cx="12" cy="12" r="2"></circle></svg></sc-if>
</span>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"code":{"editor":"enum","options":["MUSEE","MONUMENT","LIEU_EXPOSITION","THEATRE","CINEMA","BIBLIOTHEQUE","AUTRE"],"default":"MUSEE"},"size":{"editor":"int","default":24,"min":12,"max":64},"$preview":{"width":24,"height":24}}'>
class Component extends DCLogic {
  renderVals() {
    const c = this.props.code ?? 'MUSEE';
    const size = Number(this.props.size ?? 24);
    const known = ['MUSEE','MONUMENT','LIEU_EXPOSITION','THEATRE','CINEMA','BIBLIOTHEQUE'].indexOf(c) >= 0;
    return {
      size: size,
      stroke: size <= 15 ? 2 : 1.75,
      isMusee: c === 'MUSEE',
      isMonument: c === 'MONUMENT',
      isExposition: c === 'LIEU_EXPOSITION',
      isTheatre: c === 'THEATRE',
      isCinema: c === 'CINEMA',
      isBibliotheque: c === 'BIBLIOTHEQUE',
      isAutre: !known
    };
  }
}
</script>
</body>
</html>
